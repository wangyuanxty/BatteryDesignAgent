# bda 仿真库——skill 自包含安装定义（供 skill 文件夹独立分发时使用）
# 依赖列表须与仓库根 pyproject.toml 保持同步（两处同改）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bda"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pybamm",
    "numpy",
    "pyyaml",
    "rdkit",
    "ase",
    "matplotlib",
]

[project.optional-dependencies]
ml = ["torch", "mace-torch", "chgnet", "pymatgen"]
host = ["claude-agent-sdk", "python-dotenv"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bda*"]
