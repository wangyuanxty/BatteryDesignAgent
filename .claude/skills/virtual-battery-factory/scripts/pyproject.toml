# bda 仿真库——唯一安装定义（仓库根不再有 pyproject；测试配置见仓库根 pytest.ini）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bda"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pybamm",
    "numpy",
    "pyyaml",
    "rdkit",
    "ase",
    "matplotlib",
]

[project.optional-dependencies]
ml = ["torch", "mace-torch", "chgnet", "pymatgen"]
host = ["claude-agent-sdk", "python-dotenv"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bda*"]
